<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세븐틴 전국 총선 | 관리자</title><style>
:root{font-family:system-ui,-apple-system,'Pretendard',sans-serif;color:#343b62;background:#f4f3fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:40px 20px}header{text-align:center;margin-bottom:35px}.eyebrow{display:inline-block;background:white;padding:10px 18px;border-radius:100px;color:#737fae;font-weight:700}h1{font-size:clamp(28px,5vw,44px);margin:15px 0 8px}p{line-height:1.6;color:#777e99}.card{background:white;border:1px solid #e1e2ef;border-radius:22px;padding:26px;margin:18px 0;box-shadow:0 8px 28px #35395b0a}input,button,select{font:inherit;border-radius:10px;padding:12px 14px}input{width:100%;border:1px solid #cfd3e3;margin:7px 0 16px}button{border:0;background:#555e8a;color:white;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.outline{background:white;border:1px solid #ccd0e2;color:#555e8a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#eceef7;color:#56608a}.tabs button.active{background:#555e8a;color:white}.notice{padding:16px;border-radius:12px;background:#f0f2fb;margin:16px 0;line-height:1.6}.stat{font-size:34px;font-weight:800;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eceef5}th{color:#717996}td.num{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}.muted{font-size:13px}.error{color:#b32635}.success{color:#22734b}#results{min-height:200px}@media(max-width:600px){.wrap{padding:24px 13px}.card{padding:18px}th,td{padding:11px 6px;font-size:12px}}</style></head><body><div class="wrap"><header><span class="eyebrow">2026 셀카이브 배</span><h1>세븐틴 전국 총선</h1><p>관리자 전용 · 최종 결과 대시보드</p></header><section class="card" id="loginCard"><h2>관리자 로그인</h2><p>등록된 관리자 계정으로 로그인해 주세요.</p><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" id="loginBtn">로그인</button></form><p id="loginMessage" role="status"></p></section><section id="dashboard" class="hidden"><div class="card"><div class="row"><div><strong id="account"></strong><p class="muted">투표 종료 이후에만 집계 결과가 제공됩니다.</p></div><button class="outline" id="logout">로그아웃</button></div><div class="notice" id="status" role="status">서버 상태를 확인하고 있습니다.</div><div id="stats" class="hidden"><div class="muted">총 제출 건수</div><div class="stat" id="total">—</div><div class="row"><span class="muted">곡별 득표수는 해당 라운드에서 선택된 제출 건수를 기준으로 집계합니다.</span><button id="download">현재 라운드 CSV 다운로드</button></div></div></div><div class="card hidden" id="results"><div class="row"><h2>라운드별 투표 결과</h2><span class="muted" id="roundInfo"></span></div><div class="tabs" id="tabs"></div><div class="scroll"><table><thead><tr><th>순위</th><th>곡명</th><th>앨범</th><th>득표수</th><th>득표율</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><p class="muted" style="text-align:center">결과 데이터는 관리자 인증 및 서버의 종료 시각 검증을 거쳐 제공됩니다.</p></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://jgtdojplgladghivxtlj.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_HqfKuiZNaURv85pwsNoRCQ_YWn65ssu';
const FUNCTION_NAME='admin-results';
const $=id=>document.getElementById(id);
const client=createClient(SUPABASE_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let current=null,round=0;
function showLogin(msg=''){ $('loginCard').classList.remove('hidden');$('dashboard').classList.add('hidden');$('loginMessage').textContent=msg;}
function showDashboard(user){$('loginCard').classList.add('hidden');$('dashboard').classList.remove('hidden');$('account').textContent=user.email||'관리자';}
function setStatus(msg){$('status').textContent=msg;}
async function load(){const {data:{session}}=await client.auth.getSession();if(!session){showLogin();return}showDashboard(session.user);$('stats').classList.add('hidden');$('results').classList.add('hidden');setStatus('서버에서 종료 여부를 확인하는 중…');try{const {data,error}=await client.functions.invoke(FUNCTION_NAME,{body:{}});if(error){let detail='';try{detail=JSON.stringify(await error.context?.json?.())}catch{}throw new Error(detail||error.message)}if(!data?.success){if(data?.code==='NOT_CLOSED'){setStatus('투표 진행 중입니다. 종료 시각: '+new Date(data.closesAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국시간). 종료 후 새로고침해 주세요.');return}throw new Error(data?.error||'결과를 불러올 수 없습니다.')}current=data;$('total').textContent=Number(data.totalSubmissions).toLocaleString('ko-KR');$('stats').classList.remove('hidden');$('results').classList.remove('hidden');setStatus('투표가 종료되었습니다. 관리자 인증이 확인되어 집계 결과를 표시합니다.');render()}catch(e){setStatus('결과 조회 실패: '+(e?.message||String(e))+' · 서버 설정 및 관리자 권한을 확인해 주세요.')}}
function render(){const tabs=$('tabs');tabs.replaceChildren();current.rounds.forEach((r,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'라운드';b.className=round===i?'active':'';b.onclick=()=>{round=i;render()};tabs.append(b)});const r=current.rounds[round];$('roundInfo').textContent='참여 제출 '+r.participatingSubmissions.toLocaleString('ko-KR')+'건';const body=$('rows');body.replaceChildren();r.songs.forEach(s=>{const tr=document.createElement('tr');[s.rank,s.title,s.album,s.votes.toLocaleString('ko-KR'),s.percentage.toFixed(2)+'%'].forEach((v,i)=>{const td=document.createElement('td');td.textContent=String(v);if(i>=3)td.className='num';tr.append(td)});body.append(tr)})}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginMessage').textContent='로그인 중…';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginMessage').textContent='로그인 실패: '+error.message;return}$('password').value='';await load()});$('logout').onclick=async()=>{await client.auth.signOut();current=null;showLogin()};$('download').onclick=()=>{if(!current)return;const r=current.rounds[round];const quote=s=>'"'+String(s).replaceAll('"','""')+'"';const data=[['순위','곡명','앨범','득표수','득표율(%)'],...r.songs.map(s=>[s.rank,s.title,s.album,s.votes,s.percentage.toFixed(2)])];const csv='\ufeff'+data.map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='seventeen-vote-round-'+(round+1)+'.csv';a.click();URL.revokeObjectURL(url)};
load();
</script></body></html>
