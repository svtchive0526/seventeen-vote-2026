"No looking back", "DREAMSCAPE (정한x조슈아)"]];const selected=[];const $=id=>document.getElementById(id);function drawList(){const q=$('search').value.trim().toLowerCase();$('items').replaceChildren();let shown=0;catalog.forEach(([name,album],i)=>{if(q&&!(`${name} ${album}`.toLowerCase().includes(q)))return;if(++shown>90)return;const b=document.createElement('button');b.className='item';b.type='button';b.setAttribute('aria-pressed',String(selected.includes(i)));const label=document.createElement('span');const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=album;label.append(strong,small);const check=document.createElement('span');check.textContent=selected.includes(i)?'✓':'+';b.append(label,check);b.onclick=()=>{const pos=selected.indexOf(i);if(pos>=0)selected.splice(pos,1);else if(selected.length<3)selected.push(i);else {alert('최대 3곡까지 선택할 수 있어요.');return}refresh()};$('items').append(b)});if(!shown)$('items').textContent='검색 결과가 없습니다.'}function refresh(){$('selected').textContent=selected.length?`${selected.length}/3곡 · `+selected.map(i=>catalog[i][0]).join(' · '):'선택한 곡이 없습니다.';$('make').disabled=!selected.length;drawList()}$('search').oninput=drawList;$('clear').onclick=()=>{selected.length=0;$('canvas').hidden=true;['download','native','xshare'].forEach(x=>$(x).hidden=true);refresh()};function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function wrap(ctx,text,max){const out=[];let line='';for(const ch of text){if(ctx.measureText(line+ch).width>max&&line){out.push(line);line=''}line+=ch}if(line)out.push(line);return out}function make(){const c=$('canvas'),ctx=c.getContext('2d');const bg=ctx.createLinearGradient(0,0,1080,1350);bg.addColorStop(0,'#e9e9f5');bg.addColorStop(1,'#cfd5e9');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#fff';roundRect(ctx,65,80,950,1190,45);ctx.fillStyle='#6c759f';ctx.textAlign='center';ctx.font='bold 38px Pretendard,
